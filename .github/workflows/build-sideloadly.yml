name: Build IPA for Sideloadly

on:
  workflow_dispatch:
    inputs:
      spotify_ipa_url:
        description: "URL del IPA de Spotify descifrado (decrypted)"
        required: true
        type: string
      include_safari_extension:
        description: "Incluir OpenSpotify Safari Extension"
        required: false
        default: true
        type: boolean

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v4

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Download and Validate Spotify IPA
        run: |
          echo "Descargando Spotify IPA..."
          wget "${{ inputs.spotify_ipa_url }}" --no-verbose -O spotify.ipa
          file_type=$(file --mime-type -b spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::El archivo descargado no es un IPA valido. Tipo detectado: $file_type"
            exit 1
          fi
          echo "IPA validado correctamente."

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Copy SwiftProtobuf (rootful)
        run: |
          mkdir swiftprotobuf && cd "$_"
          wget https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb --no-verbose
          ar -x org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb
          tar -xvf data.tar.lzma
          cp -r Library/Frameworks/SwiftProtobuf.framework $THEOS/lib

      - name: Build EeveeSpotify DEB
        run: |
          make package FINALPACKAGE=1
          DEB=$(find . -not -name '*debug*' -path './packages/*' -name '*.deb' | head -1)
          echo "EEVEESPOTIFY_DEB=$DEB" >> $GITHUB_ENV
          echo "EEVEESPOTIFY_VERSION=$(echo $DEB | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> $GITHUB_ENV
          echo "DEB compilado: $DEB"

      - name: Download SwiftProtobuf DEB (para inyectar)
        run: |
          wget https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb \
            --no-verbose -O swiftprotobuf.deb
          echo "SWIFTPROTOBUF_DEB=swiftprotobuf.deb" >> $GITHUB_ENV

      - name: Download OpenSpotify Safari Extension
        if: ${{ inputs.include_safari_extension }}
        run: |
          git clone https://github.com/BillyCurtis/OpenSpotifySafariExtension --depth=1
          echo "SAFARI_EXT=OpenSpotifySafariExtension/OpenSpotifySafariExtension.appex" >> $GITHUB_ENV

      - name: Setup insert-dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git --depth=1
          xcrun clang -x c -arch arm64 ./insert_dylib/insert_dylib/main.c -I/usr/include/ -o insert-dylib
          sudo mv insert-dylib /usr/local/bin/
          sudo chmod +x /usr/local/bin/insert-dylib

      - name: Setup ivinject
        run: |
          git clone https://github.com/whoeevee/ivinject.git --depth=1
          cp -r ./ivinject/KnownFrameworks ~/.ivinject
          wget https://github.com/whoeevee/ivinject/releases/download/first/ivinject-arm64 --no-verbose
          sudo mv ivinject-arm64 /usr/local/bin/
          sudo chmod +x /usr/local/bin/ivinject-arm64

      - name: Setup ipapatch
        run: |
          wget https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.0/ipapatch.macos-arm64 --no-verbose
          sudo mv ipapatch.macos-arm64 /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Inject EeveeSpotify into IPA
        run: |
          OUTPUT_IPA="EeveeSpotify-Sideloadly.ipa"

          if [[ -n "$SAFARI_EXT" ]]; then
            ivinject-arm64 spotify.ipa "$OUTPUT_IPA" \
              -i "$EEVEESPOTIFY_DEB" "$SWIFTPROTOBUF_DEB" "$SAFARI_EXT" \
              -s - -d --level Optimal
          else
            ivinject-arm64 spotify.ipa "$OUTPUT_IPA" \
              -i "$EEVEESPOTIFY_DEB" "$SWIFTPROTOBUF_DEB" \
              -s - -d --level Optimal
          fi

          echo "OUTPUT_IPA=$OUTPUT_IPA" >> $GITHUB_ENV

      - name: Create Patched IPA (para Sideloadly sin JB)
        run: |
          PATCHED_IPA="EeveeSpotify-Sideloadly-patched.ipa"
          ipapatch -input "$OUTPUT_IPA" -output "$PATCHED_IPA"
          echo "PATCHED_IPA=$PATCHED_IPA" >> $GITHUB_ENV

      - name: Upload IPA como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-Sideloadly-${{ env.EEVEESPOTIFY_VERSION }}
          path: |
            ${{ env.OUTPUT_IPA }}
            ${{ env.PATCHED_IPA }}
          if-no-files-found: error
          retention-days: 7

      - name: Instrucciones
        run: |
          echo "IPA listo para Sideloadly!"
          echo "  - EeveeSpotify-Sideloadly.ipa         → TrollStore"
          echo "  - EeveeSpotify-Sideloadly-patched.ipa → Sideloadly"
